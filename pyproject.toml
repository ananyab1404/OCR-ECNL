[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-ecnl"
version = "0.2.0"
description = "Local-first hybrid PDF and image OCR service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "pytesseract>=0.3.13",
    "rapidocr==3.9.1",
    "rapid-layout==1.2.1",
    "onnxruntime-directml==1.24.4; platform_system == 'Windows'",
    "onnxruntime==1.24.4; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
